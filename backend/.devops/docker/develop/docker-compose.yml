services:
  backend:
    build:
      context: ../../../
      dockerfile: .devops/docker/develop/Dockerfile
    working_dir: /app
    env_file: ../../../.env.example
    volumes:
      - ../../../:/app
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sugamuxi
      POSTGRES_USER: sugamuxi
      POSTGRES_PASSWORD: sugamuxi
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
